name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type checks, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      HUSKY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # The published CLI targets Node.js 20+, so CI uses the oldest runtime
      # AgentKogei advertises rather than the runner's default.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checks
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
